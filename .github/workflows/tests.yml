name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q bot.py ai.py db.py postgres_db.py webapp.py curriculum.py quiz.py tests
      - name: Run tests without API secrets
        run: python -m unittest discover -s tests -v
