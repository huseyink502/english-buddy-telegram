name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: karamaz_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d karamaz_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tester:test-only-password@localhost:5432/karamaz_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q bot.py ai.py groq_ai.py news.py news_memory.py news_monitor.py db.py postgres_db.py webapp.py admin_store.py admin_telegram.py admin_web.py admin_delivery.py admin_maintenance.py admin_maintenance_remote.py retention_auth.py privacy_policy.py curriculum.py quiz.py tests
      - name: Run tests without API secrets
        run: python -m unittest discover -s tests -v
