name: Hourly news archive and daily digest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karamz-news-monitor
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$DATABASE_URL" && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Monitoring inactive: add DATABASE_URL and TELEGRAM_BOT_TOKEN secrets."
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt

      - name: Store fresh news and send due digests
        if: steps.config.outputs.enabled == 'true'
        run: python news_monitor.py
