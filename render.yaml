# Render Blueprint: surekli calisan Telegram polling botu
# Gizli API anahtarlari GitHub'a yazilmaz; Render kurulumunda sorulur.
# UYARI: Background worker + disk ucretlidir. Onaylamadan once ucreti inceleyin.
services:
  - type: worker
    name: english-buddy-telegram
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeployTrigger: off
    disk:
      name: progress-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: ALLOWED_USER_ID
        value: "0"
      - key: DB_PATH
        value: /var/data/english_buddy.sqlite3
