# Render free-web tier: Telegram HTTPS webhook, not a paid background worker.
# Free services sleep after 15 min idle and can take ~1 minute to wake.
# Without DATABASE_URL, local SQLite progress is EPHEMERAL on Render.
services:
  - type: web
    name: english-buddy-telegram
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Change 0 to YOUR Telegram numeric ID after first /whoami.
      - key: ALLOWED_USER_ID
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_PANEL_ENABLED
        value: "false"
      - key: TRANSCRIPT_DEFAULT_ENABLED
        value: "true"
      - key: PRIVACY_CONTROLLER
        sync: false
      - key: PRIVACY_CONTACT
        sync: false
      - key: PRIVACY_LEGAL_BASIS
        sync: false
      # For permanent progress, add DATABASE_URL via Render dashboard
      # using a free Neon Postgres pooled connection string.
